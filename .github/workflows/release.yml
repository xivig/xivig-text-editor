name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libopenjp2-7 libfuse2 || sudo apt-get install -y libarchive-tools libopenjp2-7 libfuse2t64

      - name: Install NPM Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Renderer TypeScript Typecheck
        run: npm run typecheck

      - name: Electron & Node TypeScript Typecheck
        run: npm run typecheck:node

      - name: Automated Unit Tests
        run: npm test

      - name: Build Web & Electron Distribution
        run: npm run build

      - name: Package Windows Binaries (NSIS & Portable)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Package Linux Binaries (AppImage, DEB, tar.gz, zip)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Package macOS Binaries (DMG & ZIP)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.zip
            release/*.dmg
            release/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
