name: CI Build & Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Renderer TypeScript Typecheck
        run: npm run typecheck

      - name: Electron & Node TypeScript Typecheck
        run: npm run typecheck:node

      - name: Automated Unit Tests
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Playwright E2E Workflow Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx playwright test
        env:
          CI: true
